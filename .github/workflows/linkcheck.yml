name: Weekly link check

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Pinned to full commit SHAs for the reason given in checks.yml; the comment names the release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: Check links
        id: lychee
        continue-on-error: true
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          lycheeVersion: v0.24.2
          # The maintainer's dead-links-only ruling covers completed results.
          # Integrity requires surfacing checker failures, so incomplete sweeps
          # fail closed. v0.24.2 exit 2 includes advisory link failures; the
          # reports below check the action outcome, exit code and JSON.
          fail: false
          failIfEmpty: false
          format: json
          output: lychee/out.json
          # Verbose retains success_map and redirect_map, including accepted bot blocks.
          args: >-
            --no-progress
            --verbose
            --root-dir ${{ github.workspace }}/site
            --accept 200,201,204,301,302,403,429,999
            --exclude '[<>]'
            --exclude '\$'
            --exclude 'example\.(com|test)'
            --exclude 'app\.internal'
            --exclude 'localhost'
            --exclude '127\.0\.0\.1'
            './*.md'
            './site/index.html'
            './site/llms.txt'

      - name: Report link results and fail on dead links
        if: always()
        env:
          LYCHEE_OUTCOME: ${{ steps.lychee.outcome }}
          LYCHEE_EXIT_CODE: ${{ steps.lychee.outputs.exit_code }}
        run: |
          python3 - <<'PY'
          import html
          import json
          import os
          from pathlib import Path


          def checked(value, kind, field):
              if type(value) is not kind:
                  raise ValueError(f"{field} must be {kind.__name__}")
              return value


          lines = [
              "Lychee action outcome: " + os.environ.get("LYCHEE_OUTCOME", "unknown"),
              "Lychee exit code: " + os.environ.get("LYCHEE_EXIT_CODE", "unavailable"),
              "Completed sweeps fail only on HTTP 404 and 410; incomplete sweeps fail closed.",
          ]
          dead = False
          incomplete = False
          try:
              if (os.environ.get("LYCHEE_OUTCOME") != "success"
                      or os.environ.get("LYCHEE_EXIT_CODE") not in ("0", "2")):
                  raise ValueError("lychee action failed or did not return exit code 0 or 2")
              data = json.loads(Path("lychee/out.json").read_text(encoding="utf-8"))
              for field in ("total", "excludes", "unknown", "unsupported"):
                  if checked(data[field], int, field) < 0:
                      raise ValueError(f"{field} must not be negative")
              if data["total"] == 0 or data["detailed_stats"] is not True:
                  raise ValueError("no links checked or detailed results unavailable")
              lines.append(f"Total: {data['total']}; excluded: {data['excludes']}; "
                           f"unknown: {data['unknown']}; unsupported: {data['unsupported']}")
              for name in ("error_map", "timeout_map", "success_map"):
                  for source, rows in sorted(checked(data[name], dict, name).items()):
                      for row in sorted(checked(rows, list, name), key=lambda item: item["url"]):
                          checked(row["url"], str, "url")
                          status = checked(row["status"], dict, "status")
                          checked(status["text"], str, "status.text")
                          code = status.get("code")
                          if "code" in status:
                              if not 100 <= checked(code, int, "status.code") <= 999:
                                  raise ValueError("invalid HTTP status code")
                          else:
                              checked(status["details"], str, "status.details")
                          # Match the numeric status field, never text or digits in a URL.
                          dead = dead or code in (404, 410)
                          if code is None or not 200 <= code < 300:
                              lines.append(f"{source}: {row['url']} | "
                                           f"{json.dumps(status, ensure_ascii=True)}")
          except (OSError, ValueError, KeyError, TypeError, AttributeError) as exc:
              incomplete = True
              lines.append(f"INCOMPLETE: sweep could not complete: {exc}")
          report = "\n".join(lines)
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Link results\n\n<pre>" + html.escape(report) + "</pre>\n")
          raise SystemExit(1 if dead or incomplete else 0)
          PY

      - name: Report citations that have moved
        # Deliberately after the link sweep. Redirects pass, so a citation that has moved
        # can keep pointing at a redirect; #16 and #17 cleaned up 82 such citations.
        # GitHub notifies only on a failed scheduled run. On 2026-09-25 the maintainer
        # chose visibility over notification: list every redirect hop without failing.
        # Read the sweep's JSON, including redirects outside Sources sections, while
        # the redirect still says where the page went. This is not a required status
        # check, so even a dead link here blocks no merge.
        if: always()
        run: |
          python3 - <<'PY'
          import html
          import json
          import os
          from pathlib import Path

          lines = []
          incomplete = False
          try:
              data = json.loads(Path("lychee/out.json").read_text(encoding="utf-8"))
              if data["detailed_stats"] is not True:
                  raise ValueError("redirect details unavailable")
              for source, chains in sorted(data["redirect_map"].items()):
                  if not isinstance(chains, list):
                      raise ValueError("redirect chains must be a list")
                  for chain in sorted(chains, key=lambda item: item["origin"]):
                      previous = chain["origin"]
                      if not isinstance(previous, str) or not isinstance(chain["redirects"], list):
                          raise ValueError("invalid redirect chain")
                      for hop in chain["redirects"]:
                          if (not isinstance(hop["url"], str) or type(hop["code"]) is not int
                                  or not 300 <= hop["code"] < 400):
                              raise ValueError("invalid redirect hop")
                          lines.append(f"{source}: {previous} -> {hop['url']} "
                                       f"(HTTP {hop['code']})")
                          previous = hop["url"]
          except (OSError, ValueError, KeyError, TypeError, AttributeError) as exc:
              incomplete = True
              lines.append(f"INCOMPLETE: sweep could not complete: {exc}")
          report = "\n".join(lines) or "No redirects recorded."
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Redirects\n\n<pre>" + html.escape(report) + "</pre>\n")
          raise SystemExit(1 if incomplete else 0)
          PY
