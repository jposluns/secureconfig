name: Weekly link check

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Pinned to full commit SHAs for the reason given in checks.yml; the comment names the release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          fail: true
          # Accepted non-2xx codes: 403 and 999 are bot-blocking responses from sites that refuse automated
          # clients (LinkedIn answers 999); 301/302 are redirects; 429 is rate limiting. A green sweep therefore
          # proves that every URL answered, not that every page was readable. The sweep is advisory for that reason.
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}/site
            --accept 200,201,204,301,302,403,429,999
            --exclude '[<>]'
            --exclude '\$'
            --exclude 'example\.(com|test)'
            --exclude 'app\.internal'
            --exclude 'localhost'
            --exclude '127\.0\.0\.1'
            './*.md'
            './site/index.html'
            './site/llms.txt'

      - name: Report citations that have moved
        # Deliberately after the link sweep. The sweep accepts 301 and 302, so a citation that
        # has moved passes it forever while pointing at a redirect; #16 and #17 were spent
        # cleaning that up once it had spread across 82 citations. This step names them while
        # the redirect still says where the page went, and it FAILS the run when a citation has
        # moved host or path, because GitHub notifies on a failed scheduled run and on nothing
        # else. Anything softer, including a host that refuses automated clients and a URL that
        # did not answer, is reported without failing. This workflow is not a required status
        # check, so a red run here blocks no merge.
        if: always()
        run: python3 tools/report_citation_drift.py
