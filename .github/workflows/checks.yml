name: Checks

# Once per change (maintainer ruling 2026-10-25, DECISIONS.md). A pull request stays a draft
# through its QA rounds, where tools/run_all_checks.sh runs locally on each fix round, and `gates`
# runs here once the change is ready: on every pull request event whose pull request is not a
# draft, including ready_for_review, which runs it on the head being marked ready. The
# converted_to_draft type is listed too, so turning a ready pull request back into a draft starts
# a run whose `gates` job is skipped, and through the concurrency group below that run cancels the
# ready run if it is still queued or in progress, since the change is going back into QA. On a
# draft the job is skipped, and a skip is not a pass for merging, although GitHub reports a job
# skipped by its `if:` to branch protection as a success. A draft cannot be merged, and the
# orchestrator's merge gate requires a `gates` job that ran and succeeded on the exact head that
# merges. On #917 at head 582a7dd0, the run record shows these observed outcomes: a push and
# ready_for_review created runs 40279911250 and 40279910962 in the same second, the ready run
# 40279910962 completed cancelled, and the draft run 40279911250 completed with its `gates` job
# skipped. The run record also shows that no `gates` job ran on that head until the pull request
# was returned to draft and marked ready again after the runs went idle. The run record does not
# say which run cancelled the other or in what order the two runs were queued. That the draft run,
# queued after the ready run, cancelled the ready run through the concurrency group below is an
# inference from the run ids and the concurrency block. The run record also does not show what
# branch protection reported for that head or which mechanism refused a merge. That in that window
# the orchestrator's merge gate is what would refuse that head is an inference, given GitHub's
# documented reporting of a skipped job to branch protection as a success. The orchestrator's merge
# step therefore waits for the runs on a head to go idle before marking a pull request ready.
#
# Only what changed (the owner's rulings of 2026-11-03). On a pull request, `gates` runs only the
# sections of tools/run_all_checks.sh that the pull request's changes affect: tools/select_gates.py
# reads the paths changed since the base commit and names the sections, and the step prints both
# lists. Only content is scoped, through an allowlist that fails closed: a file under site/ or
# site-src/ whose name ends, in any case, in .html, .css, .json, .svg, .png, .jpg, .jpeg, .webp,
# .ico, .woff2, .txt or .xml and is not _headers, _redirects or a requirements file, and the
# root project records CHANGELOG.md, TODO.md, DONE.md, DECISIONS.md and PENDING-DECISIONS.md, run
# their mapped sections. A CHANGELOG.md change also selects version-basis, llms-full, plugin and
# generated-committed, and tools/run_all_checks.sh --sections adds llms-full and plugin to any
# list that names generated-committed, as its `# depends:` line says. Every other file under
# site/ or site-src/ (_headers, which holds the CSP, _redirects, requirements files, scripts,
# Markdown, YAML such as action.yml, unknown types and files without a suffix) runs every
# section, and so does any other changed path: every guide, README.md,
# controls-reference.md, plugin/, every file under tools/, scripts/, .baseline/, .aiqt/ and
# .github/, any requirements file, CLAUDE.md, AGENTS.md, CONTRIBUTING.md, SECURITY.md, NOTICE,
# LICENSE, VERSION and any path the selector's map does not name; so does an empty list. No run
# starts on a push to main. The whole suite runs with no argument weekly on Mondays at 06:00 UTC,
# on the default branch, and on demand from the Actions tab (workflow_dispatch), which a release
# requires on its target, so a release targets the merge of #1194 or a later one. A local run
# can do either.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

# A newer run for the same pull request cancels its older run, in progress or queued, since only
# the newest head can merge. A scheduled run and a manual run are each grouped by their own run
# id, which no other run shares, and `cancel-in-progress` is false for them as well, so such a run
# is never cancelled and never cancels a pull request run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The gate suite this job runs is offline: no gate in tools/run_all_checks.sh reaches the
  # network. This job is not. Before the suite starts, the runner fetches the repository and the
  # two pinned actions below, setup-python installs Python 3.14, the shellcheck step downloads a
  # release asset, and the playwright step downloads playwright from the npm registry, Chromium
  # from Playwright's download hosts and Chromium's system libraries with apt, so an outage at
  # GitHub or in any of those downloads can fail this required check with no change in the
  # repository. That is the tradeoff accepted for these pins: the actions are pinned by commit SHA,
  # shellcheck by version and SHA-256, playwright by version and npm integrity hash, and Python to
  # an exact release that is asserted before the suite (setup-python installs its own build of it,
  # whose bytes are not checked here; the runner image is not fixed), and a failure here is loud.
  # Chromium's download is not checked against a digest (see the playwright step).
  gates:
    # Skipped on a draft pull request only; see the note above `on:`.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      # The one place the shellcheck version is written. The install step reads both values and
      # the assertion step checks the installed binary against the version, so bump the two
      # together; a version with a stale digest fails at sha256sum before anything is extracted.
      # The digest is the SHA-256 GitHub publishes for the release asset
      # shellcheck-v0.11.0.linux.x86_64.tar.xz on koalaman/shellcheck's v0.11.0 release
      # (the asset's digest field in the releases API), and on 2026-09-25 the downloaded
      # asset hashed to the same value. It covers the uploaded bytes; it is not a signature from
      # the shellcheck maintainer. #255 committed this value without recording where it came from.
      SHELLCHECK_VERSION: "0.11.0"
      SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
      # The exact Python the gates run under. 3.14.7 is what "3.14" resolved to on this workflow's
      # 2026-09-25 runs (the setup-python log: "Successfully set up CPython (3.14.7)"), so pinning it
      # changes nothing today; a bump is now a reviewed change.
      PYTHON_VERSION: "3.14.7"
    steps:
      # Actions are pinned to full commit SHAs, because a tag is a pointer its owner can move. The
      # trailing comment names the release each SHA was taken from; bump the two together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # The changelog-coverage gate reads the merge history, and the sitemap lastmod gate dates
          # each listed page by its last commit; both fail closed on a shallow clone.
          fetch-depth: 0
          # No gate pushes or fetches, so the token is not left in .git/config for later steps.
          persist-credentials: false
      # The gate suite parses HTML with html.parser, whose rawtext edge behaviour has shifted
      # across Python releases, while `ubuntu-latest` floats its system Python. Pin the exact release,
      # and assert it below, so neither a runner image update nor a new patch release can change which
      # Python the gates run under without a reviewed bump. The image's other tools (bash, grep, diff,
      # git) still float with it.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # shellcheck also floats on `ubuntu-latest`, which ships its own, and its default rule set
      # changes between releases: in #231 the runner's older shellcheck raised SC2015 on a correct
      # `[ -f ] && [ -r ] || { ...; exit; }` guard that 0.11.0 does not, so a green local run
      # reddened only in CI after push. CI therefore installs the pinned release and, in the next
      # step, asserts that a bare `shellcheck` is that binary at that version before the suite
      # runs. Local runs are NOT held to the pin: tools/check_shell_blocks.py lints with whatever
      # shellcheck is on PATH, names its version and path in the pass line, and prints a SKIP and
      # passes when none is installed. A green local run therefore predicts CI only when its pass
      # line names the pinned version. CI never runs the suite against any other.
      - name: Install the pinned shellcheck
        run: |
          set -euo pipefail
          ver="$SHELLCHECK_VERSION"
          sha="$SHELLCHECK_SHA256"
          url="https://github.com/koalaman/shellcheck/releases/download/v$ver/shellcheck-v$ver.linux.x86_64.tar.xz"
          dl="$(mktemp -d "$RUNNER_TEMP/shellcheck.XXXXXX")"
          trap 'rm -rf -- "$dl"' EXIT
          curl -fsSL --retry 3 --retry-all-errors -o "$dl/shellcheck.tar.xz" "$url"
          echo "$sha  $dl/shellcheck.tar.xz" | sha256sum -c -
          tar xf "$dl/shellcheck.tar.xz" -C "$dl"
          sudo install -m0755 "$dl/shellcheck-v$ver/shellcheck" /usr/local/bin/shellcheck
      # Asserted, not printed. #255 printed `shellcheck --version` and nothing compared it with
      # anything, so the runner's own shellcheck could have linted silently. Exact match on the
      # whole `version:` field: a missing, duplicated or different field fails, and so does a
      # `--version` that exits non-zero.
      - name: Assert the pinned shellcheck is the one on PATH
        run: |
          set -euo pipefail
          resolved="$(command -v shellcheck || true)"
          if [ "$resolved" != /usr/local/bin/shellcheck ]; then
            echo "::error::shellcheck resolves to '$resolved', not /usr/local/bin/shellcheck"
            exit 1
          fi
          got="$(shellcheck --version | sed -n '/^version:/p')"
          if [ "$got" != "version: $SHELLCHECK_VERSION" ]; then
            echo "::error::unexpected shellcheck version fields: '$got', not exactly 'version: $SHELLCHECK_VERSION'"
            exit 1
          fi
          echo "shellcheck $SHELLCHECK_VERSION at $resolved"
      # The gate suite runs `python3`; assert it is the pinned release, exactly.
      - name: Assert the pinned Python is the one on PATH
        run: |
          set -euo pipefail
          if ! got="$(python3 --version 2>&1)"; then
            echo "::error::python3 --version failed: '$got'"
            exit 1
          fi
          if [ "$got" != "Python $PYTHON_VERSION" ]; then
            echo "::error::python3 reports '$got', not exactly 'Python $PYTHON_VERSION'"
            exit 1
          fi
          echo "$got at $(command -v python3)"
      # Shared parser pin for Verify units and subsequent Sources checks.
      - name: Install the hash-locked gate parser
        run: |
          python3 -m pip install --require-hashes --only-binary :all: -r tools/requirements-gates.txt
      - name: Assert markdown-it-py 4.2.0 and the locked runtime closure
        run: python3 -I -B tools/check_verify_marking.py --assert-parser
      # The overflow gate runs .baseline/check_overflow.js, which needs node and playwright with its
      # Chromium. No action pins Node here, because no setup-node commit SHA had been read from a
      # source this change could cite, so the gate runs on the runner image's own node, which
      # floats with the image; this step asserts it is 20 or later, as playwright 1.64.1's
      # package.json requires ("engines": {"node": ">=20"}).
      - name: Assert the runner's node can run playwright 1.64.1
        run: |
          set -euo pipefail
          if ! got="$(node --version 2>&1)"; then
            echo "::error::node --version failed: '$got'"
            exit 1
          fi
          major="${got#v}"
          major="${major%%.*}"
          case "$major" in
            ''|*[!0-9]*)
              echo "::error::node reports '$got', which is not vMAJOR.MINOR.PATCH"
              exit 1
              ;;
          esac
          if [ "$major" -lt 20 ]; then
            echo "::error::node reports '$got'; playwright 1.64.1 needs node 20 or later"
            exit 1
          fi
          echo "node $got at $(command -v node), npm $(npm --version)"
      # tools/overflow/package-lock.json pins playwright 1.64.1 and playwright-core 1.64.1 by npm
      # integrity hash, and `npm ci` refuses a tarball that does not match it; --ignore-scripts runs
      # no install script. Both are installed in a copy under the runner's temporary folder, so no
      # node_modules lands in the checkout, where the secrets scan reads every file. Chromium comes
      # from `playwright install`, whose download playwright-core 1.64.1 checks only for an HTTP
      # 200 and, when the response is not chunked, a byte count equal to its Content-Length, not
      # against any digest; --with-deps also installs Chromium's system libraries with apt.
      - name: Install the pinned playwright and its Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/overflow/browsers
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/overflow"
          mkdir -p "$dir"
          cp tools/overflow/package.json tools/overflow/package-lock.json "$dir/"
          cd "$dir"
          npm ci --ignore-scripts
          got="$(node -p 'require("./node_modules/playwright/package.json").version')"
          if [ "$got" != 1.64.1 ]; then
            echo "::error::npm ci installed playwright '$got', not 1.64.1"
            exit 1
          fi
          npx playwright install --with-deps chromium
      # On a pull request, only the sections its changes affect run: the paths changed since the
      # base commit, a rename listed as both of its paths, go to tools/select_gates.py, which names
      # the sections, and both lists are printed; only the five root project records and the
      # files under site/ or site-src/ whose names end, in any case, in .html, .css, .json, .svg,
      # .png, .jpg, .jpeg, .webp, .ico, .woff2, .txt or .xml and are not _headers, _redirects or
      # a requirements file are scoped, and any other path selects every section. A CHANGELOG.md
      # change also selects version-basis, llms-full, plugin and generated-committed, and
      # --sections adds llms-full and plugin to a list that names generated-committed. If the
      # changed paths cannot be listed, every section runs. The weekly schedule and a manual run
      # run the whole suite with no argument, which is the only run that ends with "All gates
      # passed.". NODE_PATH and PLAYWRIGHT_BROWSERS_PATH point the overflow gate at the playwright
      # installed above, and SECURECONFIG_REQUIRE_OVERFLOW=1 makes a missing node or playwright a
      # failure there rather than the SKIP a local run prints.
      - name: Run the gate suite
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NODE_PATH: ${{ runner.temp }}/overflow/node_modules
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/overflow/browsers
          SECURECONFIG_REQUIRE_OVERFLOW: "1"
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            tools/run_all_checks.sh
            exit 0
          fi
          if ! changed="$(git diff --name-only --no-renames "$BASE_SHA...HEAD")"; then
            echo "::warning::could not list the paths changed since $BASE_SHA; running every section"
            tools/run_all_checks.sh
            exit 0
          fi
          printf 'Changed paths since %s:\n%s\n' "$BASE_SHA" "$changed"
          sections="$(printf '%s\n' "$changed" | python3 -I -B tools/select_gates.py | paste -sd, -)"
          echo "Selected sections: $sections"
          tools/run_all_checks.sh --sections "$sections"
