name: Checks

# Once per change (maintainer ruling 2026-10-25, DECISIONS.md). A pull request stays a draft
# through its QA rounds, where tools/run_all_checks.sh runs locally on each fix round, and `gates`
# runs here once the change is ready: on every push to main and on every pull request event whose
# pull request is not a draft, including ready_for_review, which runs it on the head being marked
# ready. The converted_to_draft type is listed too, so turning a ready pull request back into a
# draft starts a run whose `gates` job is skipped, and through the concurrency group below that run
# cancels the ready run if it is still queued or in progress, since the change is going back into
# QA. On a draft the job is skipped, and a skip is not a pass for merging, although GitHub reports
# a job skipped by its `if:` to branch protection as a success. A draft cannot be merged, and the
# orchestrator's merge gate requires a `gates` job that ran and succeeded on the exact head that
# merges.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

# A newer run for the same pull request cancels its older run, in progress or queued, since only
# the newest head can merge. A push to main is grouped by its own run id, which no other run
# shares, and `cancel-in-progress` is false for it as well, so a run on main is never cancelled
# and never cancels a pull request run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The gate suite this job runs is offline: no gate in tools/run_all_checks.sh reaches the
  # network. This job is not. Before the suite starts, the runner fetches the repository and the
  # two pinned actions below, setup-python installs Python 3.14, and the shellcheck step
  # downloads a release asset, so an outage at GitHub or in any of those downloads can fail this
  # required check with no change in the repository. That is the tradeoff accepted for these pins:
  # the actions are pinned by commit SHA, shellcheck by version and SHA-256, and Python to an exact
  # release that is asserted before the suite (setup-python installs its own build of it, whose
  # bytes are not checked here; the runner image is not fixed), and a failure here is loud.
  gates:
    # Skipped on a draft pull request only; see the note above `on:`.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      # The one place the shellcheck version is written. The install step reads both values and
      # the assertion step checks the installed binary against the version, so bump the two
      # together; a version with a stale digest fails at sha256sum before anything is extracted.
      # The digest is the SHA-256 GitHub publishes for the release asset
      # shellcheck-v0.11.0.linux.x86_64.tar.xz on koalaman/shellcheck's v0.11.0 release
      # (the asset's digest field in the releases API), and on 2026-09-25 the downloaded
      # asset hashed to the same value. It covers the uploaded bytes; it is not a signature from
      # the shellcheck maintainer. #255 committed this value without recording where it came from.
      SHELLCHECK_VERSION: "0.11.0"
      SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
      # The exact Python the gates run under. 3.14.7 is what "3.14" resolved to on this workflow's
      # 2026-09-25 runs (the setup-python log: "Successfully set up CPython (3.14.7)"), so pinning it
      # changes nothing today; a bump is now a reviewed change.
      PYTHON_VERSION: "3.14.7"
    steps:
      # Actions are pinned to full commit SHAs, because a tag is a pointer its owner can move. The
      # trailing comment names the release each SHA was taken from; bump the two together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0   # the changelog-coverage gate reads the merge history
          # No gate pushes or fetches, so the token is not left in .git/config for later steps.
          persist-credentials: false
      # The gate suite parses HTML with html.parser, whose rawtext edge behaviour has shifted
      # across Python releases, while `ubuntu-latest` floats its system Python. Pin the exact release,
      # and assert it below, so neither a runner image update nor a new patch release can change which
      # Python the gates run under without a reviewed bump. The image's other tools (bash, grep, diff,
      # git) still float with it.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # shellcheck also floats on `ubuntu-latest`, which ships its own, and its default rule set
      # changes between releases: in #231 the runner's older shellcheck raised SC2015 on a correct
      # `[ -f ] && [ -r ] || { ...; exit; }` guard that 0.11.0 does not, so a green local run
      # reddened only in CI after push. CI therefore installs the pinned release and, in the next
      # step, asserts that a bare `shellcheck` is that binary at that version before the suite
      # runs. Local runs are NOT held to the pin: tools/check_shell_blocks.py lints with whatever
      # shellcheck is on PATH, names its version and path in the pass line, and prints a SKIP and
      # passes when none is installed. A green local run therefore predicts CI only when its pass
      # line names the pinned version. CI never runs the suite against any other.
      - name: Install the pinned shellcheck
        run: |
          set -euo pipefail
          ver="$SHELLCHECK_VERSION"
          sha="$SHELLCHECK_SHA256"
          url="https://github.com/koalaman/shellcheck/releases/download/v$ver/shellcheck-v$ver.linux.x86_64.tar.xz"
          dl="$(mktemp -d "$RUNNER_TEMP/shellcheck.XXXXXX")"
          trap 'rm -rf -- "$dl"' EXIT
          curl -fsSL --retry 3 --retry-all-errors -o "$dl/shellcheck.tar.xz" "$url"
          echo "$sha  $dl/shellcheck.tar.xz" | sha256sum -c -
          tar xf "$dl/shellcheck.tar.xz" -C "$dl"
          sudo install -m0755 "$dl/shellcheck-v$ver/shellcheck" /usr/local/bin/shellcheck
      # Asserted, not printed. #255 printed `shellcheck --version` and nothing compared it with
      # anything, so the runner's own shellcheck could have linted silently. Exact match on the
      # whole `version:` field: a missing, duplicated or different field fails, and so does a
      # `--version` that exits non-zero.
      - name: Assert the pinned shellcheck is the one on PATH
        run: |
          set -euo pipefail
          resolved="$(command -v shellcheck || true)"
          if [ "$resolved" != /usr/local/bin/shellcheck ]; then
            echo "::error::shellcheck resolves to '$resolved', not /usr/local/bin/shellcheck"
            exit 1
          fi
          got="$(shellcheck --version | sed -n '/^version:/p')"
          if [ "$got" != "version: $SHELLCHECK_VERSION" ]; then
            echo "::error::unexpected shellcheck version fields: '$got', not exactly 'version: $SHELLCHECK_VERSION'"
            exit 1
          fi
          echo "shellcheck $SHELLCHECK_VERSION at $resolved"
      # The gate suite runs `python3`; assert it is the pinned release, exactly.
      - name: Assert the pinned Python is the one on PATH
        run: |
          set -euo pipefail
          if ! got="$(python3 --version 2>&1)"; then
            echo "::error::python3 --version failed: '$got'"
            exit 1
          fi
          if [ "$got" != "Python $PYTHON_VERSION" ]; then
            echo "::error::python3 reports '$got', not exactly 'Python $PYTHON_VERSION'"
            exit 1
          fi
          echo "$got at $(command -v python3)"
      # Shared parser pin for Verify units and subsequent Sources checks.
      - name: Install the hash-locked gate parser
        run: |
          python3 -m pip install --require-hashes --only-binary :all: -r tools/requirements-gates.txt
      - name: Assert markdown-it-py 4.2.0 and the locked runtime closure
        run: python3 -I -B tools/check_verify_marking.py --assert-parser
      - name: Run the gate suite
        run: tools/run_all_checks.sh
